version: 2

models:
  - name: stg_billing_events
    description: "Staging layer for raw billing events"

    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - not_null

      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null

      - name: event_type
        description: "Type of billing event"
        tests:
          - not_null
          - accepted_values:
              values: ['invoice_paid', 'invoice_adjusted', 'invoice_refunded']

      - name: amount
        description: "Transaction amount"
        tests:
          - not_null